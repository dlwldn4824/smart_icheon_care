# Fast pipeline smoke on a small subset (not full 160k)
# Full data lives in datasets/banner — use train.yaml for real training.
model: yolo11s.pt
data: datasets/banner_smoke/data.yaml
epochs: 3
imgsz: 640
batch: 8
device: auto
workers: 2
patience: 3
optimizer: AdamW
lr0: 0.001
lrf: 0.01
weight_decay: 0.0005
cos_lr: true
amp: true
cache: false
seed: 42
deterministic: false
close_mosaic: 1
project: runs/banner
name: yolo11s_smoke
exist_ok: true
pretrained: true
mosaic: 0.5
mixup: 0.0
copy_paste: 0.0
hsv_h: 0.01
hsv_s: 0.4
hsv_v: 0.3
degrees: 3.0
translate: 0.08
scale: 0.3
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
erasing: 0.1
tracking:
  min_hits: 2
  max_age: 30
  event_iou_threshold: 0.5
  event_cooldown_seconds: 300
