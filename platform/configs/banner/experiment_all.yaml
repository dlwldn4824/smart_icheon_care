# 10-epoch A/B: balanced MVP, all boxes (incl. tiny)
model: yolo11s.pt
data: datasets/banner_mvp_all/data.yaml
epochs: 10
imgsz: 640
batch: 8
device: mps
workers: 2
patience: 7
optimizer: AdamW
lr0: 0.001
lrf: 0.01
weight_decay: 0.0005
cos_lr: true
amp: true
cache: false
seed: 42
deterministic: false
