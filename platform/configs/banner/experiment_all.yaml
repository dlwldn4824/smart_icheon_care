pretrained: true
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0
hsv_h: 0.01
hsv_s: 0.4
hsv_v: 0.3
degrees: 3.0
translate: 0.08
scale: 0.4
shear: 0.0
perspective: 0.0005
flipud: 0.0
fliplr: 0.5
erasing: 0.2
